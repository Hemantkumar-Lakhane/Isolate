

# ═══════════════════════════════════════════════════════════════════════════════
# OpsGrid Infrastructure
# Run: docker-compose up -d
# ═══════════════════════════════════════════════════════════════════════════════

services:

  postgres:
    # CHANGE THIS LINE:
    image: pgvector/pgvector:pg16 
    container_name: opsgrid_postgres
    environment:
      POSTGRES_DB: opsgrid
      POSTGRES_USER: opsgrid
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsgrid_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsgrid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: opsgrid_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-opsgrid_redis_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsgrid_api
    environment:
      - WATCHFILES_FORCE_POLLING=true
      - DATABASE_URL=postgresql+asyncpg://opsgrid:${POSTGRES_PASSWORD:-opsgrid_dev_password}@postgres:5432/opsgrid
      - REDIS_URL=redis://:${REDIS_PASSWORD:-opsgrid_redis_dev}@redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@opsgrid.io}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - ADMIN_FULL_NAME=${ADMIN_FULL_NAME:-OpsGrid Admin}
      - SECRET_KEY=${SECRET_KEY:-dev_secret_key_change_in_production}
      # HF token — forwarded so sentence-transformers can authenticate
      - HF_TOKEN=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      # Embedding settings
      - PREFER_LOCAL_EMBEDDINGS=${PREFER_LOCAL_EMBEDDINGS:-true}
      - LOCAL_EMBEDDING_MODEL=${LOCAL_EMBEDDING_MODEL:-all-MiniLM-L6-v2}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
      # LLM model overrides
      - LLM_HEAVY_MODEL=${LLM_HEAVY_MODEL:-anthropic/claude-sonnet-4-6}
      - LLM_FAST_MODEL=${LLM_FAST_MODEL:-groq/llama-3.3-70b-versatile}
      - LLM_MINI_MODEL=${LLM_MINI_MODEL:-anthropic/claude-haiku-4-5-20251001}
      - ENVIRONMENT=development
    # Commented out port mapping so Docker doesn't conflict with the native Windows backend
    # ports:
    #   - "8000:8000"
    volumes:
      - .:/app
      - ./evidence:/app/evidence
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
